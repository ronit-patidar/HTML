<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- div tag is used to group element together. -->
  <!-- div is a block level element which takes full width by default. -->
  <!-- Block-level elements in HTML are elements that always start on a new line and take up the full width available (100% of parent width), pushing the next element to the next line. -->
  <div class="header"></div>
  <div class="content"></div>
  <div class="footer"></div>
  <div class="box">Hello</div>

  <style>
    .box{
      background: lightblue;
      padding: 20px;
      border-radius: 10px;
    }
  </style>

</body>
</html>
