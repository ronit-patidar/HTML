<body>
  <!-- Inline elements in HTML are elements that do not start on a new line.
 They only take up as much width as their content needs, and they stay within the same line as other elements. -->
  <span>Text One</span>
  <span>Text Two</span>
  <p>
  My favorite color is <span style="color: blue;">blue</span>.
 </p>

</body>
